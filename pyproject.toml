[project]
name = "hynet-testcase"
version = "0.1.0"
description = "Build tooling for the common reference test case of HYNET Task 3.2"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "LICENSE-DATA"]
authors = [{ name = "Valentin Mathieu", email = "valentin.mathieu@supergrid-institute.com" }]
requires-python = ">=3.14,<3.15"
dependencies = [
    "pandas>=3.0.6",
    "pypowsybl>=1.16.1",
    "pyyaml>=6.0.3",
]

[project.urls]
Repository = "https://github.com/SuperGrid-Institute/hynet-t32-reference-test-case"

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pandas-stubs>=3.0.5.260914",
    "pylint>=4.0.9",
    "types-pyyaml>=6.0.12.20260906",
]
notebooks = [
    "jupyterlab>=4",
    "matplotlib>=3.11.2",
    "pypowsybl-jupyter>=1.3.0",
]

[tool.mypy]
python_version = "3.14"
strict = true

[[tool.mypy.overrides]]
# pypowsybl ships no type information.
module = ["pypowsybl", "pypowsybl.*"]
ignore_missing_imports = true

[tool.pylint.main]
py-version = "3.14"

[tool.pylint.format]
max-line-length = 100
